<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бой</title>
<style>
  *{box-sizing:border-box}
  body{background:#1a0e0a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:0}
  #fightWrap{max-width:480px;margin:0 auto;padding:10px;min-height:100dvh;display:flex;flex-direction:column}
  .battle-names{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:bold;gap:8px}
  #battle-timer{font-size:28px;background:#333;padding:5px 15px;border-radius:10px;min-width:60px}
  .hp-row{display:flex;justify-content:space-between;font-size:14px;font-weight:900;margin-top:4px}
  .hp-bar{height:12px;background:#333;border-radius:6px;overflow:hidden;margin-top:4px}
  .hp-fill{height:100%;background:linear-gradient(#7CFC00,#2E8B57);transition:width .3s}
  .hp-fill.enemy{background:linear-gradient(#ff6b6b,#c0392b)}
  .arena{flex:1;min-height:340px;margin:12px 0 8px;background:url('/static/camp.jpg') center/cover no-repeat;background-color:#2b1a0e;border-radius:16px;border:3px solid #c89b5e;display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px 0;overflow:hidden;position:relative}
  .fighter{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
  .fighter img{width:100%;max-width:190px;height:300px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 10px rgba(0,0,0,.8));display:block}
  .vs-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);border:2px solid #ffcc00;color:#ffcc00;font-weight:900;font-size:22px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5}
  .hit-btn{flex:1;padding:16px 4px;font-size:16px;font-weight:900;border:none;border-radius:10px;cursor:pointer;color:#fff}
  .hit-btn:disabled{opacity:.5;cursor:not-allowed}
  .hit-btn.cooldown{opacity:.6;filter:grayscale(.3)}
  .btn-row{display:flex;gap:8px}
  @keyframes attackLeft { 0%{transform:translateX(0)} 50%{transform:translateX(24px) scale(1.03)} 100%{transform:translateX(0)} }
  @keyframes shakeRight { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} }
  @keyframes shakeScreen { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
  .potions-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#2b1a0e;padding:6px;border:2px solid #5a3e22;border-radius:8px;margin-top:10px}
  .potion-slot{background:linear-gradient(#4a3525,#2b1a0e);border:1px solid #8a6a3d;border-radius:4px;height:36px;display:flex;align-items:center;justify-content:center;color:#ffb84d;font-weight:bold;font-size:12px}
</style>
</head>
<body>
<div id="fightWrap">
  <div class="battle-names"><span>ТЫ ({{ lvl|default(1) }} ур.)</span><span id="battle-timer">20</span><span>{{ enemy_type|default('Враг') }}</span></div>

  <div style="text-align:center;margin:8px 0 0"><div style="height:8px;background:#222;border-radius:10px;overflow:hidden"><div id="timerBar" style="height:100%;width:100%;background:#ffcc00;transition:width .2s"></div></div><div id="turnText" style="font-size:13px;color:#ffcc00;margin-top:3px">Твой ход! 20 сек</div></div>

  <div style="display:flex;gap:10px;margin-top:6px">
    <div style="flex:1;text-align:left"><div class="hp-row"><span>ВЫ</span><span><span id="myHp">{{ my_hp|default(20) }}</span> / {{ my_max_hp|default(20) }}</span></div><div class="hp-bar"><div class="hp-fill" id="myBar" style="width:{{ my_per|default(100) }}%"></div></div></div>
    <div style="flex:1;text-align:right"><div class="hp-row"><span>{{ enemy_type|default('Враг') }}</span><span><span id="enHp">{{ enemy_hp|default(20) }}</span> / {{ enemy_max|default(20) }}</span></div><div class="hp-bar"><div class="hp-fill enemy" id="enBar" style="width:{{ enemy_per|default(100) }}%"></div></div></div>
  </div>

  <div class="arena" id="arena">
    <div class="fighter" id="heroBox"><img id="heroImg" src="/static/{{ player_img|default('barbarian_game_size.png') }}" onerror="this.style.opacity=0"></div>
    <div class="vs-badge">VS</div>
    <div class="fighter" id="enemyBox"><img id="enemyImg" src="/static/{{ enemy_img|default('ancient_warrior.png') }}" onerror="this.style.opacity=0"></div>
  </div>

  <!-- Кнопки: только УДАР и БЕГ, СУПЕР убран -->
  <div class="btn-row" style="margin-top:8px">
    <button class="hit-btn" id="hitBtn" style="background:#2e7d32" onclick="makeAction('hit')">👊 УДАР (<span id="hitCnt">{{ hit_cnt|default(0) }}</span>)</button>
    <button class="hit-btn" style="background:#555" onclick="makeAction('run')">🏃 БЕГ</button>
  </div>

  <div class="potions-bar"><div class="potion-slot">🍷 1</div><div class="potion-slot">🧪 2</div><div class="potion-slot">📜 3</div><div class="potion-slot">🛡️ 4</div><div class="potion-slot">⚡ 5</div></div>
  <a href="/promysel" style="display:block;color:#fff;margin-top:10px">← На промысел</a>
</div>

<div id="endOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px"><div style="background:linear-gradient(#3a2510,#1a0e0a);border:3px solid #ffcc00;border-radius:22px;padding:26px;width:100%;max-width:320px;text-align:center"><h2 id="endTitle" style="margin:0;color:gold;font-size:26px"></h2><div id="trophyBox" style="background:rgba(255,215,0,0.12);border:1.5px solid #c9a45c;border-radius:14px;padding:14px;margin:14px 0;font-size:16px;line-height:1.8;color:#ffe9a3"></div><a href="/promysel" style="display:block;background:linear-gradient(#ffcc00,#c9a45c);color:#000;padding:14px;border-radius:12px;font-weight:900;text-decoration:none">На промысел ➔</a></div></div>

<script src="/static/game.js"></script>
</body>
</html>
